  <g id="text_22">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 375.297422)">A standalone parent and child moving bytes and discarding them: the transport and nothing else, so neither the cipher nor the link</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 384.899609)">is in the way. The pipe cares about the chunk size and the ring does not. At 1.5 GB/s the pipe costs about 26% of a core in</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 394.501797)">transport alone and the ring about 7% — which is the saving the measured push turns into.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 404.103984)">Windows: Dell Latitude 7490, i5-8350U (4 cores / 8 threads, 15 W)  ·  Linux: Ryzen 7 PRO 7840U  ·  Thunderbolt networking, MTU 65330, link 20 Gbit/s</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 413.706172)">rsync 3.5.0 Windows port, github.com/nuket/rsync-windows  ·  win32/win32shmpipe.c as committed in 3e660145  ·  © 2026 Max Vilimpoc</text>
  </g>
 </g>
