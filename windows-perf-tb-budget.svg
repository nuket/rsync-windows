   <g id="text_23">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="122.467187" y="17.837812" transform="rotate(-0 122.467187 17.837812)">Where a push's throughput goes, measured back to back</text>
   </g>
  </g>
  <g id="text_24">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(35.527188 401.597344)">All five measured in one interleaved run at a8664bae, because this laptop throttles: the same push can read 25% slower an hour later.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(35.527188 411.199531)">The two ssh rows differ only in what feeds stdin, so the gap between them is the cost of the pipe and nothing else.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(35.527188 420.801719)">Windows: Dell Latitude 7490, i5-8350U (4 cores / 8 threads, 15 W)  ·  Linux: Ryzen 7 PRO 7840U  ·  Thunderbolt networking, MTU 65330, link 20 Gbit/s</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(35.527188 430.403906)">rsync 3.5.0 Windows port, github.com/nuket/rsync-windows  ·  4 GB transfers, aes128-gcm, source file warm in the page cache  ·  © 2026 Max Vilimpoc</text>
  </g>
