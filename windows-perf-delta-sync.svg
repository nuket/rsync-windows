  <g id="text_33">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 340.821895)">Delta transfer of a file edited in place: rsync's sender rolled its weak checksum byte by byte through every changed block; now it probes the next aligned blocks first and prefetches its lookups.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 350.424082)">Windows: i5-8350U laptop, Realtek RTL8156 USB 2.5GbE, Intel I219-LM 1GbE  ·  Linux: Ryzen 9 7950X  ·  rsync 3.5.0 Windows port, github.com/nuket/rsync-windows</text>
  </g>
