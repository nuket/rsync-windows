  <g id="text_22">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(105.037188 398.717344)">iperf3's single stream measures iperf3, not the link: ssh alone over the same connection sustains 1924 MB/s.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(105.037188 408.319531)">Windows: Dell Latitude 7490, i5-8350U (4 cores / 8 threads, 15 W)  ·  Linux: Ryzen 7 PRO 7840U (16 threads)  ·  Thunderbolt networking, MTU 65330, link 20 Gbit/s</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(105.037188 417.921719)">rsync 3.5.0 Windows port, github.com/nuket/rsync-windows  ·  4 GB transfers, aes128-gcm, source file warm in the page cache  ·  © 2026 Max Vilimpoc</text>
