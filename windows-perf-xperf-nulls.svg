   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="17.837812" transform="rotate(-0 7.2 17.837812)">Negative results are results: neither of these is in the tree</text>
  </g>
  <g id="text_28">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.928 363.135531)">Both panels share one axis. A 16 MB ring gives rsync 12 ms of runway and changes nothing, which is another way of saying the ring was never the queue that mattered.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.928 372.737719)">Windows: Dell Latitude 7490, i5-8350U (4 cores / 8 threads, 15 W)  ·  Linux: Ryzen 7 PRO 7840U (16 threads)  ·  Thunderbolt networking, MTU 65330, link 20 Gbit/s</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.928 382.339906)">rsync 3.5.0 Windows port, github.com/nuket/rsync-windows  ·  4 GB transfers, aes128-gcm, source file warm in the page cache  ·  © 2026 Max Vilimpoc</text>
  </g>
