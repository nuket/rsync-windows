# Build rsync for Windows -- x64 and x86 -- and publish both when tagged.
#
# Every push builds, tests and uploads an artifact, so the branch is always
# known to compile and a build is always downloadable from the run page.  Only
# a v* tag publishes a Release, and the tag is only accepted when the source
# is an upstream *release* -- version.h carrying a plain "3.5.0" rather than
# "3.5.0dev".  That is the policy in one sentence: this port ships the Windows
# adaptation layer for a released rsync, not for a snapshot of upstream master.
#
# It also keeps the Releases page readable.  Publishing on every push meant a
# release per commit, pruned to the last three, and a tag per commit alongside
# them; what someone actually wants there is the list of rsyncs this port has
# shipped.
#
# This is the only workflow that runs on this branch.  Every other workflow in
# .github/workflows/ is triggered by `push: branches: [ master ]`, and the
# Windows port lives on windows-cmake-port, so none of them fire here.
name: Windows build and release

on:
  push:
    branches: [ windows-cmake-port ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ windows-cmake-port ]
  workflow_dispatch:

permissions:
  contents: write        # needed to create a release; read would be enough otherwise

jobs:
  build:
    runs-on: windows-2022
    name: Build rsync.exe and rsync-x86.exe
    steps:
    - uses: actions/checkout@v7
      with:
        # Not shallow: the version resource names the commit that was built,
        # which comes from git.  A depth-1 checkout still has HEAD, but the
        # tag-agreement check below wants the tag object too.
        fetch-depth: 0
        # openssh/ is Win32-OpenSSH, pinned; ssh.exe is built from it below.
        submodules: true

    - name: Install Ninja if the image lacks it
      shell: pwsh
      run: |
        if (Get-Command ninja -ErrorAction SilentlyContinue) {
          Write-Host "ninja already present: $((Get-Command ninja).Source)"
        } else {
          choco install -y --no-progress ninja
          echo "C:\ProgramData\chocolatey\bin" >>$Env:GITHUB_PATH
        }

    - name: Build and test
      shell: cmd
      # windows-build-and-test.bat finds MSVC through vswhere and calls the
      # right vcvars itself, so no toolchain action is needed.  It defaults to
      # --arch both: x64 into build-x64\, x86 into build-x86\, each configured,
      # built and run through the test suite separately.  The ssh transfer
      # tests skip on their own without RSYNC_WIN_TEST_HOST.
      run: windows-build-and-test.bat --clean

    - name: Build ssh.exe, x64 and x86
      shell: pwsh
      # Win32-OpenSSH from the openssh/ submodule with the patches in
      # win32/openssh/patches: the client Windows ships reads its stdin 3KB
      # at a time, which held a push from a Windows machine at 17MB/s.  The
      # script builds against Microsoft's published LibreSSL 3.8.2 SDK -- the
      # same libcrypto.dll the Windows OpenSSH Client component puts in
      # System32, which is what ssh.exe loads -- and leaves build-x64\ssh.exe and
      # build-x86\ssh-x86.exe.  No DLL ships with either.
      run: |
        .\win32\openssh\build-openssh.ps1 -Arch both
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Check no upstream test was absorbed unreviewed
      shell: pwsh
      # A rebase onto a new upstream release brings its new tests along.  This
      # fails when one of them applies to Windows and is neither covered by a
      # win32/tests test nor written down as an accepted gap -- so the choice
      # gets made deliberately instead of by omission.  See README "Testing".
      run: |
        python win32/tests/coverage_map.py --check
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Show what was built, and check both are self-contained
      shell: pwsh
      run: |
        # Each step gets a fresh shell, so the vcvars environment the build
        # step set up is gone and dumpbin is not on PATH.  Find it the way
        # windows-build-and-test.bat finds the compiler.  The x64 dumpbin
        # reads a 32-bit image perfectly well, so one copy covers both.
        $vswhere = "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                -property installationPath
        $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                    Select-Object -Last 1).FullName
        if (-not $dumpbin) { Write-Error "dumpbin not found under $vs"; exit 1 }

        # Machine type as well as imports: the whole point of shipping two
        # binaries is that they are for different architectures, and a build
        # directory that somehow configured for the wrong one would otherwise
        # sail through as a duplicate of the other.
        # ssh.exe needs a few more of Windows' own DLLs than rsync.exe does
        # (Schannel, the crypto store, the user profile), plus libcrypto.dll,
        # which the Windows OpenSSH Client component installs in System32 --
        # deliberately not linked in: Windows' build of LibreSSL uses AES-NI,
        # and rsync.exe's PreferSystem32Images hardening, inherited by the
        # ssh.exe it starts, takes the System32 copy in any case.
        $rsyncDlls = '^(WS2_32|ADVAPI32|KERNEL32)\.dll$'
        $sshDlls   = '^(WS2_32|ADVAPI32|KERNEL32|CRYPT32|Secur32|USER32|USERENV|bcrypt|SHLWAPI|ole32|SHELL32|Netapi32|Rpcrt4|ntdll|libcrypto)\.dll$'
        $builds = @(
          @{ Path = 'build-x64\rsync.exe';             Arch = 'x64'; Machine = 'x64'; Allowed = $rsyncDlls },
          @{ Path = 'build-x86\rsync-x86.exe';     Arch = 'x86'; Machine = 'x86'; Allowed = $rsyncDlls },
          @{ Path = 'build-x64\ssh.exe';               Arch = 'x64'; Machine = 'x64'; Allowed = $sshDlls },
          @{ Path = 'build-x86\ssh-x86.exe';       Arch = 'x86'; Machine = 'x86'; Allowed = $sshDlls }
        )

        foreach ($b in $builds) {
          if (-not (Test-Path $b.Path)) { Write-Error "$($b.Path) was not built"; exit 1 }
          $vi = (Get-Item $b.Path).VersionInfo
          Write-Host "--- $($b.Path)  ($((Get-Item $b.Path).Length) bytes)"
          Write-Host "  FileVersion    : $($vi.FileVersion)"
          Write-Host "  ProductVersion : $($vi.ProductVersion)"
          Write-Host "  FileDescription: $($vi.FileDescription)"
          Write-Host "  LegalCopyright : $($vi.LegalCopyright)"

          $headers = & $dumpbin /headers $b.Path
          $machine = $headers | Select-String -Pattern 'machine \((.+)\)' |
                     Select-Object -First 1
          if (-not $machine -or $machine.Matches[0].Groups[1].Value -ne $b.Machine) {
            Write-Error "$($b.Path) is not a $($b.Machine) image: $machine"
            exit 1
          }
          Write-Host "  machine        : $($b.Machine)"

          $dlls = & $dumpbin /dependents $b.Path |
                  Select-String -Pattern '\.dll' | ForEach-Object { $_.Line.Trim() }
          Write-Host "  imports        : $($dlls -join ', ')"

          # The point of the static CRT: these three ship with Windows, so the
          # binary runs on a machine with no redistributable installed.  If a
          # VCRUNTIME or api-ms-win-crt import ever reappears, fail here rather
          # than ship something that will not start on a clean machine.
          $unexpected = $dlls | Where-Object { $_ -notmatch $b.Allowed }
          if ($unexpected) {
            Write-Error "$($b.Path) imports something outside the Windows base set: $($unexpected -join ', ')"
            exit 1
          }
        }
        Write-Host "all four are self-contained: only Windows' own DLLs are imported"

    - name: Stage the files to ship
      shell: pwsh
      run: |
        $ver    = (Get-Item build-x64\rsync.exe).VersionInfo.ProductVersion
        $ver86  = (Get-Item build-x86\rsync-x86.exe).VersionInfo.ProductVersion

        # One release, one version: both binaries come out of the same
        # checkout, so a disagreement means one of the two build directories
        # is stale and the release would be labelled for only one of them.
        if ($ver -ne $ver86) {
          Write-Error "version mismatch: x64 is $ver, x86 is $ver86"
          exit 1
        }

        # One zip per architecture, and the same names inside each: rsync.exe
        # and the ssh.exe it runs belong together, and a release asset list
        # is flat -- no directories -- so the architecture goes in the zip's
        # name rather than the files'.  The -x86 suffixes the build gives its
        # outputs stop at the zip boundary.
        New-Item -ItemType Directory dist, stage\x64, stage\x86 | Out-Null
        Copy-Item build-x64\rsync.exe            stage\x64\rsync.exe
        Copy-Item build-x64\ssh.exe              stage\x64\ssh.exe
        Copy-Item build-x86\rsync-x86.exe    stage\x86\rsync.exe
        Copy-Item build-x86\ssh-x86.exe      stage\x86\ssh.exe
        foreach ($a in 'x64', 'x86') {
          Copy-Item COPYING              "stage\$a\COPYING.txt"
          Copy-Item build-x64\NOTICE-ssh.txt "stage\$a\NOTICE-ssh.txt"
          # The installer, so an unpacked zip sets itself up: run from beside
          # rsync.exe the script installs those files instead of downloading.
          Copy-Item setup-windows-rsync.ps1 "stage\$a\setup-windows-rsync.ps1"
          Copy-Item setup-windows-rsync.bat "stage\$a\setup-windows-rsync.bat"
          # As .txt: it is plain text, and .txt opens with a double-click on
          # any Windows, where .md asks what to open it with.
          Copy-Item RELEASE-NOTES.md "stage\$a\RELEASE-NOTES.txt"
          $zip = "rsync-windows-$a.zip"
          Compress-Archive -Path "stage\$a\*" -DestinationPath "dist\$zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist\$zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "dist\$zip.sha256"
          Write-Host "$zip  $hash"
        }
        Copy-Item build-x64\NOTICE-ssh.txt dist\
        Copy-Item BUILD-CMAKE.md dist\
        Copy-Item RELEASE-NOTES.md dist\RELEASE-NOTES.txt
        "VER=$ver" >>$Env:GITHUB_ENV
        "SSH_VER=$((& build-x64\ssh.exe -V 2>&1) -join '')" >>$Env:GITHUB_ENV

        # <upstream release>-g<port rev>.  The release half comes from
        # version.h and the rev names the commit here that built it, so the
        # two questions -- which rsync, and which build of the Windows work --
        # each have an answer and they move independently.
        if ($ver -match '^(.*)-g([0-9a-fA-F]+)$') {
          "RSYNC_VER_BASE=$($Matches[1])" >>$Env:GITHUB_ENV
          "RSYNC_VER_PORT=$($Matches[2])" >>$Env:GITHUB_ENV
        } else {
          "RSYNC_VER_BASE=$ver" >>$Env:GITHUB_ENV
          "RSYNC_VER_PORT="     >>$Env:GITHUB_ENV
        }
        Write-Host "staged rsync $ver, x64 and x86"

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        # Every run gets one, tagged or not: this is how a build is downloaded
        # between releases now that pushes no longer publish one.
        #
        # Loose files, not an archive: upload-artifact always zips what it is
        # given, so handing it a zip produced a zip inside a zip.  The
        # artifact name is what GitHub calls the zip it builds.
        name: rsync-${{ env.VER }}-windows
        path: dist/*
        if-no-files-found: error

    - name: Check the tag is one this source may be released under
      # Only tag pushes get this far, and only tag pushes publish.  Both checks
      # exist because the tag is written by hand: it is the one input to this
      # workflow that nothing else validates.
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        $tag = $Env:GITHUB_REF_NAME

        # Policy: releases are cut from upstream releases.  version.h reads
        # "3.5.0" at a release tag and "3.5.1dev" everywhere in between, so a
        # "dev" here means the branch was rebased onto master mid-cycle and
        # this tag should not have been pushed.
        if ($Env:RSYNC_VER_BASE -match 'dev') {
          Write-Error ("this source is rsync $Env:RSYNC_VER_BASE, which is not an upstream release. " +
                       "Rebase onto an upstream release tag before tagging a release here.")
          exit 1
        }

        # The tag names a version; the build computed one from version.h and
        # the commit.  If they disagree, the tag was pushed at the wrong commit
        # or spelled wrong, and the release would be labelled with a version
        # the binaries inside it do not carry.
        if ($tag -ne "v$Env:VER") {
          Write-Error "tag $tag does not match the version built, which is $Env:VER (expected tag v$Env:VER)"
          exit 1
        }
        Write-Host "tag $tag agrees with the build: rsync $Env:RSYNC_VER_BASE, port rev $Env:RSYNC_VER_PORT"

    - name: Publish release
      # Tag pushes only.  A push to the branch builds and uploads an artifact
      # but publishes nothing, so the Releases page lists the rsyncs this port
      # has shipped rather than every commit.  Never for pull requests: a PR
      # from a fork must not be able to publish.
      if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # `gh release view` exits non-zero when the release is absent, which is
        # a question here rather than a failure.  The runner sets
        # ErrorActionPreference to Stop, and PowerShell 7.4 can turn a native
        # command's exit code into a terminating error, so ask for exit codes
        # and check them by hand.
        $ErrorActionPreference = 'Continue'
        $PSNativeCommandUseErrorActionPreference = $false

        $tag = $Env:GITHUB_REF_NAME

        # Re-running a job for the same tag would otherwise fail on the release
        # that already exists.  Not --cleanup-tag: the tag is the deliberate
        # act that produced this run and deleting it would delete the thing
        # being released.
        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "release $tag exists; replacing it"
          gh release delete $tag --yes
        }

        # Lines here are not wrapped, deliberately: GitHub renders a single
        # newline in release notes as a line break, so text wrapped to 80
        # columns in this file comes out ragged on a narrow screen.  One
        # paragraph is one line, and the browser wraps it to whatever width it
        # actually has.
        $notes = @"
        Native Windows build of rsync $Env:RSYNC_VER_BASE, for 64-bit and 32-bit Windows.

        ## Downloads

        | download | for |
        | --- | --- |
        | ``rsync-windows-x64.zip`` | 64-bit Windows -- the one to take unless you know you need the other |
        | ``rsync-windows-x86.zip`` | 32-bit Windows |

        Each zip holds ``rsync.exe``, the ``ssh.exe`` it runs (see below), ``COPYING.txt``, ``NOTICE-ssh.txt``, ``RELEASE-NOTES.txt`` (the short version of this page), and an installer: ``setup-windows-rsync.bat`` with the ``setup-windows-rsync.ps1`` it runs. Unpack the zip anywhere and double-click the ``.bat``: it asks for elevation, copies the files to ``C:\Tools\rsync``, puts that on the machine ``PATH``, and sets up the OpenSSH client, ``ssh-agent`` and (unless ``-SkipServer``) ``sshd``. Or skip the installer and just unpack into a directory on your ``PATH``, keeping the two exes together. Same source, same options, same behaviour: the two zips differ only in the architecture they were compiled for, and each has a ``.sha256`` beside it.

        ## Why an ssh.exe

        rsync runs its remote end through ssh, and on Windows that means Microsoft's OpenSSH client. The one Windows ships reads its stdin 3KB at a time with a thread per read, which holds a transfer *from* a Windows machine at about 17MB/s no matter how fast the link is. This ``ssh.exe`` is the same client -- $Env:SSH_VER, built from the pinned ``openssh/`` submodule -- with that fixed, and with three more costs that only show on a fast link removed: a thread created for every write to stdout, a named pipe created for every pass through the main loop by OpenSSH's portable ``pselect()`` fallback, and socket sends and receives done on the crypto thread rather than on threads of their own, plus two staging copies per byte, a packet buffer freed and reallocated per packet, and a kernel mutex taken for every packet's random padding; and AES-GCM runs through Windows CNG (BCrypt), 35% faster on the same core than LibreSSL's EVP (``SSH_AESGCM_BACKEND=libcrypto`` in the environment forces the old path). rsync.exe prefers it automatically when it sits in the same directory: with it, a transfer runs at the speed of the link on Ethernet, and at ~1.4GB/s sending and ~1.26GB/s receiving over 20Gbit Thunderbolt networking (rsync ~1GB/s pushing, ~980MB/s pulling). Everything else about it is Microsoft's: it uses the same ``~/.ssh``, the same ssh-agent, the same known_hosts. An ``-e`` naming a different ssh by path is used as given.

        It needs the **OpenSSH Client** Windows component (Settings > Optional features; ``setup-windows-rsync.ps1`` installs it), because it uses the ``libcrypto.dll`` that component puts in System32 -- Windows' own build of LibreSSL, which uses AES-NI and runs AES at several GB/s -- for everything but the AES-GCM bulk cipher. That is deliberate: rsync.exe's process hardening makes an ssh.exe it starts take the System32 copy regardless, and a LibreSSL built from source for this release ran AES in software at a tenth of the speed. No DLL ships with it, so the 32-bit build is for 32-bit Windows, where System32 holds a 32-bit libcrypto.dll. It is built against the same LibreSSL 3.8.2 that Windows ships (OpenSSH Client 9.5 and later), with the same mitigations as rsync.exe -- CFG, CET, ``/sdl``, ``/Qspectre`` -- and with zlib linked in. Everything in it is under a permissive licence -- OpenSSH (BSD), Microsoft's Win32 layer (BSD), zlib -- and every text is in the attached ``NOTICE-ssh.txt``.

        ## Reading the version

        ``````
        $Env:VER
        ``````

        | part | meaning |
        | --- | --- |
        | ``$Env:RSYNC_VER_BASE`` | the upstream rsync release this is a build of |
        | ``g$Env:RSYNC_VER_PORT`` | the commit in this repository that built it ([browse](https://github.com/$Env:GITHUB_REPOSITORY/commit/$Env:GITHUB_SHA)) |

        ``ssh.exe`` reports its own version (``ssh -V``): $Env:SSH_VER.

        Releases here are cut only from upstream **releases**. This repository is the Windows adaptation layer for rsync: the first half of the version says which rsync you are getting, the second says which revision of the Windows work built it. A new upstream release moves the first; a fix to the port moves the second. ``rsync --version`` prints the same string, and both binaries carry it in their file properties.

        Builds between releases are not published here. Every push to ``windows-cmake-port`` is still built and tested, and its binaries are attached to that run under **Actions** if you want one.

        ## Verifying a download

        ``````
        certutil -hashfile rsync-windows-x64.zip SHA256
        ``````

        and compare against the matching ``.sha256`` file.

        ## Notes

        No Visual C++ redistributable is needed by either build: the C runtime is linked in, and the only imports are WS2_32, ADVAPI32 and KERNEL32, all of which ship with Windows.

        Source, licence (GPL-3.0-or-later), and what is and is not supported are in this repository -- see BUILD-CMAKE.md. Symlinks, hard links, daemon mode, ACLs and xattrs are **not** supported on Windows.
        "@

        gh release create $tag `
          dist\rsync-windows-x64.zip dist\rsync-windows-x64.zip.sha256 `
          dist\rsync-windows-x86.zip dist\rsync-windows-x86.zip.sha256 `
          dist\NOTICE-ssh.txt dist\RELEASE-NOTES.txt `
          --title "rsync $Env:RSYNC_VER_BASE for Windows" `
          --notes $notes `
          --target $Env:GITHUB_SHA `
          --latest
        if ($LASTEXITCODE -ne 0) {
          Write-Error "gh release create failed with exit code $LASTEXITCODE"
          exit 1
        }
        Write-Host "published release $tag"
