# Watch RsyncProject/rsync master, and say so when it moves ahead of us.
#
# This branch is a port that gets rebased onto upstream master as that moves.
# GitHub's branch page states the position -- "34 commits ahead, 0 behind" --
# but nothing tells you when the second number stops being zero.  This does:
# once a day it works out the same two numbers and, when we are behind, files
# an issue naming the new upstream commits, then closes it once a rebase has
# brought us level again.
#
# Deliberately uses no actions at all.  Everything here is git and gh, both
# preinstalled on the runner, so the repository's "allowed actions" policy
# cannot stop this from running -- which matters for a watcher whose whole
# value is that it keeps running unattended.
#
# Copyright (C) 2026 Max Vilimpoc, rsync CMake/Windows port.
# Distributed under the same GPL-3.0-or-later terms as the rest of rsync.
name: Upstream drift

on:
  schedule:
    # 06:23 UTC daily.  Off the hour: scheduled jobs bunch up at :00 and get
    # queued.  Scheduled runs only ever fire from the repository's default
    # branch, which for this fork is windows-cmake-port -- if the default
    # branch is ever changed, this workflow stops running and does so
    # silently, which is the one failure mode to remember about it.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: RsyncProject/rsync
  UPSTREAM_BRANCH: master
  # Long enough to be recognisable in a notification, short enough to read.
  TITLE_PREFIX: 'Upstream moved:'

jobs:
  check:
    runs-on: ubuntu-latest
    name: Compare against upstream master
    steps:
    - name: Work out how far apart the two branches are
      shell: bash
      run: |
        set -euo pipefail

        # No checkout action, and no working tree either: this only needs
        # commit history.  --filter=blob:none leaves the file contents on the
        # server, which turns a ~100 MB clone into a few MB.
        git init -q work && cd work
        git remote add origin   "https://github.com/${GITHUB_REPOSITORY}.git"
        git remote add upstream "https://github.com/${UPSTREAM}.git"
        # Explicit refspecs rather than `git fetch origin BRANCH`, so the
        # remote-tracking refs below are guaranteed to exist rather than
        # relying on git's opportunistic update of them.  --no-tags because
        # upstream carries ~170 release tags that this has no use for.
        git fetch -q --filter=blob:none --no-tags origin \
                  "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
        git fetch -q --filter=blob:none --no-tags upstream \
                  "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

        ours="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
        theirs="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
        base="$(git merge-base "$ours" "$theirs")"

        # The same two numbers GitHub's branch page prints, and the same
        # merge-base the CMake version scheme uses for the upstream rev -- so
        # a build called 3.5.0dev-gABC-gDEF and this check agree on what ABC is.
        ahead="$(git rev-list --count "${base}..${ours}")"
        behind="$(git rev-list --count "${base}..${theirs}")"

        {
          echo "ahead=$ahead"
          echo "behind=$behind"
          echo "base=$(git rev-parse --short=8 "$base")"
          echo "upstream_head=$(git rev-parse --short=8 "$theirs")"
        } >>"$GITHUB_ENV"

        echo "$ahead ahead, $behind behind (merge-base $(git rev-parse --short=8 "$base"))"

        # The commit list goes in the issue body, so it says what actually
        # landed rather than only how much.  Capped: a long-neglected branch
        # should not produce an issue nobody will read.
        if [ "$behind" -gt 0 ]; then
          # Written to a file and then truncated, rather than piped into head:
          # under `set -o pipefail`, head closing the pipe early kills git with
          # SIGPIPE and takes the step down with it.
          git log --reverse --format='- [`%h`](https://github.com/'"${UPSTREAM}"'/commit/%H) %s' \
                  "${base}..${theirs}" >/tmp/all-commits.md
          head -50 /tmp/all-commits.md >/tmp/commits.md
          if [ "$behind" -gt 50 ]; then
            echo "- ...and $((behind - 50)) more" >>/tmp/commits.md
          fi
        fi

    - name: Report
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # `gh issue ...` works out which repository it means from the git
        # remote of the working directory, and there is no checkout here -- the
        # clone this job makes lives in work/, and that step's `cd` did not
        # outlive it.  So gh ran in a directory that is not a git repository at
        # all and exited 1 before doing anything.  GH_REPO says it outright,
        # and every call below also passes -R, so neither the environment nor
        # the working directory can decide this by accident.
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        compare="https://github.com/${UPSTREAM}/compare/${base}...${UPSTREAM_BRANCH}"

        echo "$(gh --version | head -1), GH_REPO=${GH_REPO:-unset}, cwd $(pwd)"

        # GitHub disables Issues on a fork by default, and this repository is a
        # fork, so the issue route cannot be assumed to exist.
        issues_on="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .has_issues 2>/dev/null || echo false)"

        # Whether an issue can actually be filed is answered by trying the
        # read, not by inferring it from a setting: a token without the scope,
        # a rate limit or an outage all end the same way, and any of them
        # should fall back to the summary rather than kill the step with a bare
        # exit 1.  This is what went wrong twice.
        existing=""
        can_file=false
        if [ "$issues_on" = "true" ]; then
          # One issue, reused.  Found by title rather than by label, so nothing
          # has to exist in the repository beforehand for this to work.
          if existing="$(gh issue list -R "${GITHUB_REPOSITORY}" --state open --limit 50 \
                         --json number,title \
                         --jq "[.[] | select(.title | startswith(\"${TITLE_PREFIX}\"))] | .[0].number // empty" 2>&1)"; then
            can_file=true
          else
            echo "note: cannot use issues (${existing}); falling back to the job summary"
            existing=""
          fi
        else
          echo "note: issues are disabled on ${GITHUB_REPOSITORY}; falling back to the job summary"
        fi

        if [ "$behind" -eq 0 ]; then
          echo "### In sync with ${UPSTREAM} ${UPSTREAM_BRANCH}" >>"$GITHUB_STEP_SUMMARY"
          echo "" >>"$GITHUB_STEP_SUMMARY"
          echo "\`${GITHUB_REF_NAME}\` is $ahead commits ahead, 0 behind (base \`$base\`)." >>"$GITHUB_STEP_SUMMARY"

          # Closing it is the other half of the job: an issue that stays open
          # after the rebase trains you to ignore it.
          if [ "$can_file" = "true" ] && [ -n "$existing" ]; then
            gh issue comment -R "${GITHUB_REPOSITORY}" "$existing" --body \
              "Back in sync: \`${GITHUB_REF_NAME}\` is now $ahead commits ahead of \`${UPSTREAM}@${UPSTREAM_BRANCH}\` and 0 behind, on base \`${base}\`. Closing."
            gh issue close -R "${GITHUB_REPOSITORY}" "$existing"
            echo "closed #$existing"
          fi
          echo "in sync; nothing to report"
          exit 0
        fi

        title="${TITLE_PREFIX} ${behind} new commit(s) on ${UPSTREAM} ${UPSTREAM_BRANCH}"
        body="$(cat <<EOF
        \`${GITHUB_REF_NAME}\` is **${ahead} commits ahead, ${behind} behind** \`${UPSTREAM}@${UPSTREAM_BRANCH}\`.

        | | |
        | --- | --- |
        | merge-base | \`${base}\` |
        | upstream head | \`${upstream_head}\` |
        | compare | [${base}...${UPSTREAM_BRANCH}](${compare}) |

        ## What landed upstream

        $(cat /tmp/commits.md)

        ## Rebasing

        \`\`\`
        git fetch upstream
        git rebase upstream/${UPSTREAM_BRANCH}
        windows-build-and-test.bat --clean
        \`\`\`

        The next build after that renames itself: the version is
        \`<release>-g<upstream rev>-g<port rev>\`, so the first rev becomes
        \`${upstream_head}\`.

        This issue is updated daily while the branch is behind, and closed
        automatically once it is level again.
        EOF
        )"

        # The summary goes out first, and unconditionally: whatever happens to
        # the issue below, the run page itself should say what was found.
        {
          echo "### Behind ${UPSTREAM} ${UPSTREAM_BRANCH}"
          echo ""
          echo "\`${GITHUB_REF_NAME}\`: ${ahead} ahead, **${behind} behind**, base \`${base}\`."
          echo ""
          cat /tmp/commits.md
          echo ""
          echo "[Compare](${compare})"
        } >>"$GITHUB_STEP_SUMMARY"

        if [ "$can_file" != "true" ]; then
          # No issue to file, so fail the run instead -- GitHub mails the
          # owner about a failed scheduled run by default, so the alert still
          # arrives.  Failing loudly beats succeeding quietly: the one thing
          # this workflow must never do is notice drift and say nothing.
          {
            echo ""
            echo "> Issues could not be used for this run, so it fails instead"
            echo "> of filing one.  The step log says why."
          } >>"$GITHUB_STEP_SUMMARY"
          cat /tmp/commits.md
          echo "::error title=Upstream moved ahead::${behind} new commit(s) on ${UPSTREAM} ${UPSTREAM_BRANCH}; ${GITHUB_REF_NAME} is ${ahead} ahead, ${behind} behind. Could not file an issue -- see the job summary."
          exit 1
        fi

        # A failure here is worth failing the run for: the drift is real, an
        # issue is the agreed way to say so, and silence is the one outcome
        # that must not happen.
        if [ -n "$existing" ]; then
          gh issue edit -R "${GITHUB_REPOSITORY}" "$existing" --title "$title" --body "$body"
          echo "updated #$existing"
        else
          # Assigned, because assignment notifies regardless of how the
          # repository is watched -- the point of this is to reach someone.
          gh issue create -R "${GITHUB_REPOSITORY}" --title "$title" --body "$body" \
                          --assignee "${GITHUB_REPOSITORY_OWNER}" \
            || gh issue create -R "${GITHUB_REPOSITORY}" --title "$title" --body "$body"
          echo "opened a new drift issue"
        fi
