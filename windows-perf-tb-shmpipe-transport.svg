   <g id="text_19">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="102.42" y="17.457891" transform="rotate(-0 102.42 17.457891)">Why it was worth trying: the hop on its own, between two processes on one machine</text>
   </g>
