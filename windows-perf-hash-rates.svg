  <g id="text_40">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 353.781895)">Measured by the t_win32checksum helper on a 1 MB buffer, quiet machine, clean build (b0ad68fc). xxHash's own MSVC dispatcher was 2.5× slower than the baseline and was not used.</text>
