# Watch RsyncProject/rsync for a new release, and say so when one appears.
#
# This branch is a port that sits on an upstream *release*, not on upstream
# master: the source it carries is whatever `version.h` names, and releases
# here are cut only from those points.  So the actionable signal is "a newer
# rsync has been tagged", not "master moved" -- master moves most days and
# almost none of those commits are a reason to do anything.
#
# Once a day this compares the release named in our version.h against the
# newest release tag upstream carries, and when upstream is ahead it files an
# issue naming the new release, then closes it once a rebase has brought us
# level again.
#
# Deliberately uses no actions at all.  Everything here is git and gh, both
# preinstalled on the runner, so the repository's "allowed actions" policy
# cannot stop this from running -- which matters for a watcher whose whole
# value is that it keeps running unattended.
#
# Copyright (C) 2026 Max Vilimpoc, rsync CMake/Windows port.
# Distributed under the same GPL-3.0-or-later terms as the rest of rsync.
name: Upstream drift

on:
  schedule:
    # 06:23 UTC daily.  Off the hour: scheduled jobs bunch up at :00 and get
    # queued.  Scheduled runs only ever fire from the repository's default
    # branch, which for this fork is windows-cmake-port -- if the default
    # branch is ever changed, this workflow stops running and does so
    # silently, which is the one failure mode to remember about it.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: RsyncProject/rsync
  # Long enough to be recognisable in a notification, short enough to read.
  TITLE_PREFIX: 'Upstream released:'

jobs:
  check:
    runs-on: ubuntu-latest
    name: Compare against the newest upstream release
    steps:
    - name: Work out which release we carry and which is newest upstream
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # No checkout and no clone: the two things this needs are one file
        # from our branch and the upstream tag list, and both can be had
        # without fetching ~100 MB of history.
        ours="$(gh api "repos/${GITHUB_REPOSITORY}/contents/version.h?ref=${GITHUB_REF_NAME}" \
                  --jq .content | base64 -d \
                | sed -n 's/^#define RSYNC_VERSION "\(.*\)"/\1/p')"
        if [ -z "$ours" ]; then
          echo "::error title=Cannot read version.h::RSYNC_VERSION not found on ${GITHUB_REF_NAME}"
          exit 1
        fi

        # Proper releases only.  Upstream also carries ~170 tags of the form
        # v3.2.2pre1 and v3.4.1-sec-patches3; a prerelease is not something to
        # rebase onto, and a sec-patches branch tag is not a release at all.
        newest="$(git ls-remote --tags --refs "https://github.com/${UPSTREAM}.git" \
                  | sed -n 's#.*refs/tags/v\([0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?\)$#\1#p' \
                  | sort -V | tail -1)"
        if [ -z "$newest" ]; then
          echo "::error title=No upstream release tags found::git ls-remote returned nothing usable"
          exit 1
        fi

        # A "dev" suffix means the branch is sitting on upstream master partway
        # through a cycle rather than on a release, which the release policy
        # says should not happen.  Strip it for the comparison and flag it.
        base="${ours%dev}"
        if [ "$base" != "$ours" ]; then
          echo "note: version.h says '$ours' -- this branch is not on a release"
          echo "off_release=1" >>"$GITHUB_ENV"
        else
          echo "off_release=0" >>"$GITHUB_ENV"
        fi

        # sort -V puts the older first; if that is the newest upstream tag then
        # we are level or ahead.  Equal versions sort either way, so the
        # equality case is tested on its own.
        if [ "$base" = "$newest" ]; then
          behind=0
        elif [ "$(printf '%s\n%s\n' "$base" "$newest" | sort -V | tail -1)" = "$newest" ]; then
          behind=1
        else
          behind=0
        fi

        {
          echo "ours=$ours"
          echo "base=$base"
          echo "newest=$newest"
          echo "behind=$behind"
        } >>"$GITHUB_ENV"

        echo "we carry $ours; newest upstream release is $newest; behind=$behind"

    - name: Report
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # `gh issue ...` works out which repository it means from the git
        # remote of the working directory, and there is no checkout here, so
        # gh would run in a directory that is not a git repository at all and
        # exit 1 before doing anything.  GH_REPO says it outright, and every
        # call below also passes -R, so neither the environment nor the
        # working directory can decide this by accident.
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        compare="https://github.com/${UPSTREAM}/compare/v${base}...v${newest}"
        relnotes="https://github.com/${UPSTREAM}/releases/tag/v${newest}"

        # GitHub disables Issues on a fork by default, and this repository is a
        # fork, so the issue route cannot be assumed to exist.
        issues_on="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .has_issues 2>/dev/null || echo false)"

        # Whether an issue can actually be filed is answered by trying the
        # read, not by inferring it from a setting: a token without the scope,
        # a rate limit or an outage all end the same way, and any of them
        # should fall back to the summary rather than kill the step.
        existing=""
        can_file=false
        if [ "$issues_on" = "true" ]; then
          # One issue, reused.  Found by title rather than by label, so nothing
          # has to exist in the repository beforehand for this to work.
          if existing="$(gh issue list -R "${GITHUB_REPOSITORY}" --state open --limit 50 \
                         --json number,title \
                         --jq "[.[] | select(.title | startswith(\"${TITLE_PREFIX}\"))] | .[0].number // empty" 2>&1)"; then
            can_file=true
          else
            echo "note: cannot use issues (${existing}); falling back to the job summary"
            existing=""
          fi
        else
          echo "note: issues are disabled on ${GITHUB_REPOSITORY}; falling back to the job summary"
        fi

        if [ "$behind" -eq 0 ]; then
          {
            echo "### On the newest upstream release"
            echo ""
            echo "\`${GITHUB_REF_NAME}\` carries rsync \`${ours}\`, and \`v${newest}\` is the newest release upstream."
            if [ "$off_release" = "1" ]; then
              echo ""
              echo "> Note: \`version.h\` says \`${ours}\`, so this branch is on upstream master partway"
              echo "> through a cycle rather than on a release tag.  Releases are only cut from"
              echo "> upstream release tags, so a tag push from here would be rejected by the build."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          # Closing it is the other half of the job: an issue that stays open
          # after the rebase trains you to ignore it.
          if [ "$can_file" = "true" ] && [ -n "$existing" ]; then
            gh issue comment -R "${GITHUB_REPOSITORY}" "$existing" --body \
              "Back in sync: \`${GITHUB_REF_NAME}\` now carries rsync \`${ours}\`, which is the newest upstream release. Closing."
            gh issue close -R "${GITHUB_REPOSITORY}" "$existing"
            echo "closed #$existing"
          fi
          echo "level with upstream; nothing to report"
          exit 0
        fi

        title="${TITLE_PREFIX} rsync ${newest}"
        body="$(cat <<EOF
        \`${GITHUB_REF_NAME}\` carries rsync **${ours}**; upstream's newest release is **${newest}**.

        | | |
        | --- | --- |
        | ours (\`version.h\`) | \`${ours}\` |
        | newest upstream | [\`v${newest}\`](${relnotes}) |
        | what changed | [v${base}...v${newest}](${compare}) |

        ## Rebasing onto it

        \`\`\`
        git fetch upstream --tags
        git tag pre-rebase/onto-v${newest} windows-cmake-port   # so a bad rebase loses nothing
        git rebase v${newest}
        windows-build-and-test.bat --clean
        \`\`\`

        Watch for upstream state that the port has to make thread-local: the
        receiver runs as a thread here, so any new file-scope mutable variable
        shared by the generator and receiver halves needs \`RSYNC_TLS\`.  Git
        merges those in without a conflict, so they have to be looked for.

        Once the rebase builds and tests clean, tag it to cut a release:

        \`\`\`
        git tag -a v${newest}-g\$(git rev-parse --short=8 HEAD) -m "rsync ${newest} for Windows"
        git push origin windows-cmake-port --tags
        \`\`\`

        This issue is updated daily while the branch is behind, and closed
        automatically once it is level again.
        EOF
        )"

        # The summary goes out first, and unconditionally: whatever happens to
        # the issue below, the run page itself should say what was found.
        {
          echo "### Behind upstream"
          echo ""
          echo "\`${GITHUB_REF_NAME}\` carries \`${ours}\`; newest upstream release is [\`v${newest}\`](${relnotes})."
          echo ""
          echo "[What changed](${compare})"
        } >>"$GITHUB_STEP_SUMMARY"

        if [ "$can_file" != "true" ]; then
          # No issue to file, so fail the run instead -- GitHub mails the
          # owner about a failed scheduled run by default, so the alert still
          # arrives.  Failing loudly beats succeeding quietly: the one thing
          # this workflow must never do is notice a release and say nothing.
          {
            echo ""
            echo "> Issues could not be used for this run, so it fails instead"
            echo "> of filing one.  The step log says why."
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::error title=Upstream released rsync ${newest}::we carry ${ours}. Could not file an issue -- see the job summary."
          exit 1
        fi

        # A failure here is worth failing the run for: the drift is real, an
        # issue is the agreed way to say so, and silence is the one outcome
        # that must not happen.
        if [ -n "$existing" ]; then
          gh issue edit -R "${GITHUB_REPOSITORY}" "$existing" --title "$title" --body "$body"
          echo "updated #$existing"
        else
          # Assigned, because assignment notifies regardless of how the
          # repository is watched -- the point of this is to reach someone.
          gh issue create -R "${GITHUB_REPOSITORY}" --title "$title" --body "$body" \
                          --assignee "${GITHUB_REPOSITORY_OWNER}" \
            || gh issue create -R "${GITHUB_REPOSITORY}" --title "$title" --body "$body"
          echo "opened a new release-drift issue"
        fi
