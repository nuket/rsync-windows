  <g id="text_26">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 410.021344)">Processor time of each process over the same 4.3 GB push, mean of four interleaved runs; dots are the runs.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 419.623531)">rsync stops copying into the kernel and calling WriteFile per chunk; ssh stops copying back out of it, and the pump thread that</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 429.225719)">read its stdin gives way to a notifier thread that moves no bytes and only runs when the main loop is about to block.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 438.827906)">Windows: Dell Latitude 7490, i5-8350U (4 cores / 8 threads, 15 W)  ·  Linux: Ryzen 7 PRO 7840U  ·  Thunderbolt networking, MTU 65330, link 20 Gbit/s</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 448.430094)">rsync 3.5.0 Windows port, github.com/nuket/rsync-windows  ·  4.3 GB transfers, aes128-gcm, source file warm in the page cache  ·  kernel pipe = a8664bae, shared-memory ring = 3e660145  ·  © 2026 Max Vilimpoc</text>
  </g>
 </g>
