   <g id="text_19">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="85.86" y="17.457891" transform="rotate(-0 85.86 17.457891)">Why it was worth trying: the hop on its own, before any of rsync's work</text>
