  </g>
  <g id="text_22">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 375.297422)">Nothing here crosses a network. A parent and a child on the Windows laptop, the parent writing bytes and the child throwing them</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 384.899609)">away: the hop between two local processes and nothing else — no ssh, no cipher, no link, no disk. The pipe cares about the chunk</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 394.501797)">size and the ring does not. At 1.5 GB/s the pipe costs about 26% of a core in transport alone and the ring about 7%, which is the</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 404.103984)">saving the measured push turns into.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 413.706172)">Both processes on the Windows machine: Dell Latitude 7490, i5-8350U (4 cores / 8 threads, 15 W)  ·  no network, no disk</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 423.308359)">rsync 3.5.0 Windows port, github.com/nuket/rsync-windows  ·  win32/win32shmpipe.c as committed in 3e660145  ·  © 2026 Max Vilimpoc</text>
  </g>
 </g>
